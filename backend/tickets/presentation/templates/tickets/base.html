<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ticket Manager</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #f0f2f5;
      color: #1e293b;
      min-height: 100vh;
    }

    /* ---------- Header ---------- */
    header {
      background: #1e40af;
      color: #fff;
      padding: 0 32px;
      height: 56px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    header h1 { font-size: 1.1rem; font-weight: 600; letter-spacing: .3px; }

    /* ---------- Main ---------- */
    main { max-width: 1100px; margin: 32px auto; padding: 0 24px; }

    /* ---------- Card ---------- */
    .card {
      background: #fff;
      border-radius: 8px;
      box-shadow: 0 1px 4px rgba(0,0,0,.08);
      padding: 28px 32px;
    }
    .card-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 24px;
    }
    .card-title { font-size: 1rem; font-weight: 600; }

    /* ---------- Buttons ---------- */
    .btn {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 7px 16px;
      border-radius: 6px;
      border: none;
      font-size: .875rem;
      font-weight: 500;
      cursor: pointer;
      text-decoration: none;
      transition: opacity .15s;
    }
    .btn:hover { opacity: .85; }
    .btn-primary   { background: #2563eb; color: #fff; }
    .btn-secondary { background: #e2e8f0; color: #1e293b; }
    .btn-warning   { background: #f59e0b; color: #fff; }
    .btn-danger    { background: #dc2626; color: #fff; }
    .btn-sm { padding: 4px 10px; font-size: .8rem; }

    /* ---------- Alerts ---------- */
    .alert {
      padding: 10px 16px;
      border-radius: 6px;
      margin-bottom: 20px;
      font-size: .875rem;
    }
    .alert-error { background: #fee2e2; color: #991b1b; border-left: 4px solid #dc2626; }

    /* ---------- Table ---------- */
    table { width: 100%; border-collapse: collapse; font-size: .875rem; }
    thead th {
      text-align: left;
      padding: 10px 14px;
      background: #f8fafc;
      color: #64748b;
      font-weight: 600;
      font-size: .78rem;
      text-transform: uppercase;
      letter-spacing: .4px;
      border-bottom: 1px solid #e2e8f0;
    }
    tbody tr { border-bottom: 1px solid #f1f5f9; }
    tbody tr:last-child { border-bottom: none; }
    tbody tr:hover { background: #f8fafc; }
    tbody td { padding: 12px 14px; vertical-align: middle; }

    .uuid-cell { font-family: monospace; font-size: .78rem; color: #94a3b8; }

    /* ---------- Badges ---------- */
    .badge {
      display: inline-block;
      padding: 2px 10px;
      border-radius: 999px;
      font-size: .75rem;
      font-weight: 600;
    }
    .badge-novo        { background: #dbeafe; color: #1d4ed8; }
    .badge-andamento   { background: #fef9c3; color: #92400e; }
    .badge-resolvido   { background: #dcfce7; color: #166534; }
    .badge-baixa       { background: #f1f5f9; color: #475569; }
    .badge-media       { background: #ffedd5; color: #9a3412; }
    .badge-alta        { background: #fee2e2; color: #991b1b; }

    /* ---------- Actions cell ---------- */
    .actions { display: flex; gap: 6px; }

    /* ---------- Empty state ---------- */
    .empty {
      text-align: center;
      padding: 48px 0;
      color: #94a3b8;
      font-size: .9rem;
    }

    /* ---------- Form ---------- */
    .form-group { margin-bottom: 20px; }
    label { display: block; font-size: .875rem; font-weight: 500; margin-bottom: 6px; }
    input[type="text"],
    textarea,
    select {
      width: 100%;
      padding: 9px 12px;
      border: 1px solid #cbd5e1;
      border-radius: 6px;
      font-size: .875rem;
      color: #1e293b;
      background: #fff;
      transition: border-color .15s;
    }
    input[type="text"]:focus,
    textarea:focus,
    select:focus {
      outline: none;
      border-color: #2563eb;
      box-shadow: 0 0 0 3px rgba(37,99,235,.1);
    }
    textarea { resize: vertical; min-height: 90px; }
    .form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
    .form-actions { display: flex; gap: 10px; margin-top: 28px; }

    /* ---------- Modal overlay ---------- */
    .modal-overlay {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,.45);
      z-index: 100;
      align-items: center;
      justify-content: center;
    }
    .modal-overlay.open { display: flex; }
    .modal {
      background: #fff;
      border-radius: 10px;
      box-shadow: 0 8px 32px rgba(0,0,0,.18);
      width: 100%;
      max-width: 520px;
      padding: 28px 32px;
      position: relative;
    }
    .modal-title {
      font-size: 1rem;
      font-weight: 600;
      margin-bottom: 20px;
      padding-bottom: 12px;
      border-bottom: 1px solid #e2e8f0;
    }
    .modal-close {
      position: absolute;
      top: 16px; right: 20px;
      background: none;
      border: none;
      font-size: 1.3rem;
      cursor: pointer;
      color: #94a3b8;
      line-height: 1;
    }
    .modal-close:hover { color: #1e293b; }
    .modal-footer { display: flex; justify-content: flex-end; gap: 10px; margin-top: 24px; }

    /* ---------- Detail grid ---------- */
    .detail-grid { display: grid; grid-template-columns: 130px 1fr; gap: 10px 0; font-size: .875rem; }
    .detail-label { color: #64748b; font-weight: 500; padding: 4px 0; }
    .detail-value { padding: 4px 0; word-break: break-word; }
  </style>
</head>
<body>

<header>
  <h1>Ticket Manager</h1>
</header>

<main>
  {% block content %}{% endblock %}
</main>

{% block modals %}{% endblock %}

</body>
</html>
