<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ticket Manager</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
            background: #f5f5f5;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
        }
        .card {
            background: #fff;
            border-radius: 8px;
            padding: 48px 64px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
            text-align: center;
        }
        h1 { font-size: 2rem; color: #1a1a1a; margin-bottom: 8px; }
        p  { color: #666; font-size: 1rem; }
        .badge {
            display: inline-block;
            margin-top: 24px;
            padding: 4px 12px;
            background: #e8f5e9;
            color: #2e7d32;
            border-radius: 999px;
            font-size: 0.85rem;
            font-weight: 500;
        }
    </style>
</head>
<body>
    <div class="card">
        <h1>Ticket Manager</h1>
        <p>Sistema de gerenciamento de tickets</p>
        <span class="badge">Hello World</span>
    </div>
</body>
</html>
